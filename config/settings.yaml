# AI-2D Master System Settings

project:
  name: "AI-2D MASTER V3.5"
  version: "3.5.0"
  author: "Kronos-Ensemble Team"

model_params:
  sequence_length: 10
  batch_size: 32
  learning_rate: 0.001
  ensemble_weights:
    kronos: 0.65
    timesfm: 0.35

inference:
  confidence_threshold: 0.85
  default_session: "morning"
  timezone: "Asia/Yangon"

api:
  openai_model: "gpt-4-turbo-preview"
  max_tokens: 500
  retry_attempts: 5

market:
  currency: "THB"
  index: "SET"
  trading_days: [0, 1, 2, 3, 4] # Mon-Fri
